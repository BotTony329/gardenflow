name: Android Release Candidate

on:
  workflow_dispatch:

jobs:
  release-candidate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Restore upload key
        if: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_UPLOAD_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_UPLOAD_KEY_ALIAS"
            echo "keyPassword=$ANDROID_UPLOAD_KEY_PASSWORD"
          } > keystore.properties

      - name: Run tests
        run: ./gradlew test

      - name: Run lint
        run: ./gradlew lint

      - name: Build release AAB
        run: ./gradlew bundleRelease

      - name: Build release APK for manual QA
        run: ./gradlew assembleRelease

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: GardenFlow-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: GardenFlow-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload mapping
        uses: actions/upload-artifact@v4
        with:
          name: GardenFlow-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
